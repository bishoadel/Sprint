<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Toma el Rasol - Church Class Management Portal</title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/user.css">
  <style>
    body {
      background: radial-gradient(circle at top center, #162B4D 0%, #0D2040 50%, #071328 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .gateway-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(212, 175, 55, 0.3);
      backdrop-filter: blur(15px);
      border-radius: var(--radius-lg);
      padding: 40px 32px;
      max-width: 520px;
      width: 100%;
      text-align: center;
      box-shadow: var(--shadow-glow), 0 20px 50px rgba(0,0,0,0.5);
    }
    .gateway-logo {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid var(--gold-primary);
      box-shadow: 0 0 25px rgba(212, 175, 55, 0.6);
      margin-bottom: 20px;
    }
    .gateway-title {
      font-size: 2.2rem;
      color: #FFFFFF;
      margin-bottom: 6px;
    }
    .gateway-subtitle {
      color: var(--gold-primary);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      font-size: 0.9rem;
      margin-bottom: 30px;
    }
    .gateway-actions {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .portal-option-btn {
      padding: 16px 24px;
      font-size: 1.05rem;
      font-weight: 700;
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: space-between;
      text-decoration: none;
      transition: all var(--transition-normal);
    }
    .portal-option-btn:hover {
      transform: translateY(-2px);
    }
    .lookup-box {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }
  </style>
</head>
<body>

  <div class="gateway-card fade-in">
    <img src="assets/logo/logo.jpeg" alt="St. Thomas Logo" class="gateway-logo">
    <h1 class="gateway-title">Toma el Rasol</h1>
    <div class="gateway-subtitle">St. Thomas Youth Class Management</div>

    <div class="gateway-actions">
      <a href="admin/index.html" class="portal-option-btn btn-gold">
        <span>🛡️ Admin Portal</span>
        <span>→</span>
      </a>
      <a href="user/index.html?id=CH-0001" class="portal-option-btn btn-outline-gold">
        <span>🎮 Demo Child User Portal (Ahmed)</span>
        <span>→</span>
      </a>
    </div>

    <div class="lookup-box">
      <p style="color: rgba(255,255,255,0.7); font-size: 0.88rem; margin-bottom: 12px; font-weight: 600;">
        🔍 Enter 5-Digit Child ID to open User Portal directly:
      </p>
      <form onsubmit="openUserPortal(event)" style="display: flex; gap: 8px;">
        <input type="text" id="lookup-child-code" class="form-control" placeholder="e.g. 48291" maxlength="5" pattern="[0-9]{5}" style="background: rgba(255,255,255,0.1); color: #fff; border-color: rgba(212,175,55,0.4);" required>
        <button type="submit" class="btn btn-gold btn-sm">Go</button>
      </form>
    </div>
  </div>

  <script>
    function openUserPortal(e) {
      e.preventDefault();
      const code = document.getElementById('lookup-child-code').value.trim();
      if (code) {
        window.location.href = `user/index.html?id=${encodeURIComponent(code)}`;
      }
    }
  </script>
</body>
</html>
