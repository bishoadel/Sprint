<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Child User Portal - Toma el Rasol</title>

  <!-- CSS -->
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/user.css">

  <!-- Canvas Confetti Library CDN -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body class="user-portal-body">

  <div class="user-container">
    
    <!-- Child ID Manual Entry Landing Card (Shows if visiting /user/index.html directly without QR code) -->
    <div id="user-id-entry-card" class="score-hero-card fade-in" style="display:none; max-width:480px; margin:40px auto; padding:36px 24px;">
      <img src="../assets/logo/logo.jpeg" alt="Logo" style="width:90px; height:90px; border-radius:50%; border:3px solid var(--gold-primary); box-shadow:var(--shadow-glow); margin-bottom:16px;">
      <h2 style="color:#FFFFFF; font-size:1.6rem; margin-bottom:6px;">Toma el Rasol</h2>
      <p style="color:var(--gold-light); font-weight:700; font-size:0.85rem; text-transform:uppercase; letter-spacing:0.08em; margin-bottom:24px;">
        Youth Class Portal Access
      </p>

      <form id="form-manual-id-entry" onsubmit="TomaUserApp.handleManualIdSubmit(event)">
        <div class="form-group" style="margin-bottom:16px;">
          <label class="form-label" style="color:#FFFFFF; font-size:0.95rem; margin-bottom:8px;">Enter your 5-digit Child ID:</label>
          <input type="text" id="input-manual-child-id" class="form-control" placeholder="e.g. 48291" maxlength="5" pattern="[0-9]{5}" style="text-align:center; font-size:1.4rem; font-weight:800; letter-spacing:0.1em; background:rgba(255,255,255,0.1); color:#FFFFFF; border-color:var(--gold-primary);" required>
        </div>
        <button type="submit" class="btn btn-gold btn-lg" style="width:100%;">Go to My Portal 🚀</button>
      </form>
    </div>

    <!-- Main Child Dashboard Container (Shows when Child ID is identified) -->
    <div id="user-main-dashboard">
      <!-- User Portal Header -->
      <header class="user-header">
        <div class="user-brand">
          <img src="../assets/logo/logo.jpeg" alt="Logo" class="user-logo">
          <div class="user-title-wrap">
            <h1 id="user-portal-child-name">Loading Profile...</h1>
            <span>Toma el Rasol Youth Portal</span>
          </div>
        </div>
        <div class="child-id-pill" id="user-portal-child-code">00000</div>
      </header>

    <!-- Birthday Mode Banner Container -->
    <div id="birthday-banner-container"></div>

    <!-- User Navigation Tabs (Score & Store) -->
    <div class="user-tabs">
      <button class="user-tab-btn active" data-tab="score" onclick="TomaUserApp.switchTab('score')">
        <span>⭐ Score & Rank</span>
      </button>
      <button class="user-tab-btn" data-tab="store" onclick="TomaUserApp.switchTab('store')">
        <span>🎁 Presents Store</span>
      </button>
    </div>

    <!-- TAB 1: SCORE PANEL -->
    <section class="user-panel active" id="user-panel-score">
      
      <!-- Hero Score Card -->
      <div class="score-hero-card">
        <div class="points-label">TOTAL POINTS</div>
        <div class="points-value" id="user-total-points">0</div>
        <div class="child-welcome-name" id="user-welcome-msg">Welcome back!</div>
      </div>

      <!-- Attendance Streaks Row -->
      <div class="streaks-grid">
        <div class="streak-card">
          <div class="flame-icon" id="mass-flame">🔥</div>
          <div class="streak-info">
            <div class="streak-count" id="mass-streak-count">0 Weeks</div>
            <div class="streak-title">Mass Streak</div>
          </div>
        </div>

        <div class="streak-card">
          <div class="flame-icon" id="ss-flame">🔥</div>
          <div class="streak-info">
            <div class="streak-count" id="ss-streak-count">0 Weeks</div>
            <div class="streak-title">Sunday School</div>
          </div>
        </div>
      </div>

      <!-- Class Leaderboard -->
      <div class="user-leaderboard-section">
        <div class="section-title">
          <span>🏆 Class Leaderboard</span>
        </div>
        <div class="user-lb-list" id="user-leaderboard-list">
          <!-- Dynamic Leaderboard -->
        </div>
      </div>

    </section>

    <!-- TAB 2: STORE PANEL -->
    <section class="user-panel" id="user-panel-store">
      <div id="user-store-status-banner" class="store-disabled-banner" style="display:none;">
        ⚠️ Store is currently turned OFF by General Admin. Purchasing is disabled.
      </div>

      <div class="user-gifts-grid" id="user-gifts-container">
        <!-- Dynamic Gifts Cards -->
      </div>
    </section>

    </div><!-- End #user-main-dashboard -->
  </div><!-- End .user-container -->

  <!-- Supabase JS Client SDK CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Application Scripts -->
  <script src="../js/config.js"></script>
  <script src="../js/supabase.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/qr-engine.js"></script>
  <script src="../js/streaks.js"></script>
  <script src="../js/leaderboard.js"></script>
  <script src="../js/store.js"></script>
  <script src="../js/birthdays.js"></script>
  <script src="../js/user-app.js"></script>

</body>
</html>
