name: Automated 24/7 Birthday Email Reminder Cron Job

on:
  schedule:
    # Runs daily at 16:00 PM (4:00 PM - 1 day in advance before birthday)
    - cron: '0 14 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  send-birthday-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Run Automated Birthday Reminder Email Dispatch Script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          EMAIL_WEBHOOK_URL: ${{ secrets.EMAIL_WEBHOOK_URL }}
        run: node scripts/send_birthday_emails.js

